<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <title>Sky Inn Hotel | Room Edit</title>
  </head>
  <body>
    <header class="site-header">
      <div class="container navbar">
        <div class="brand">
          <span class="brand-mark">S</span>
          <div>
            <span>Sky Inn Hotel</span>
            <small>Admin panel</small>
          </div>
        </div>

        <nav class="nav-links" aria-label="main navigation">
          <a href="welcome.html">Customer View</a>
          <a href="admin-dashboard.html">Dashboard</a>
          <a href="room-edit.html" class="active">Room Edit</a>
          <a href="index.html">Logout</a>
        </nav>

        <div class="nav-meta">
          <span class="user-pill">Hotel Admin</span>
        </div>
      </div>
    </header>

    <main class="section">
      <div class="container">
        <div class="section-header">
          <div>
            <h2>Room management</h2>
            <p>Update pricing, status, and room details for each accommodation type.</p>
          </div>
          <button class="btn primary">Add room</button>
        </div>

        <div class="admin-card">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Room</th>
                  <th>Price / night</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>Standard Room</td>
                  <td><input type="number" value="180" class="field-group" style="min-height: 42px;" /></td>
                  <td>
                    <select class="field-group" style="min-height: 42px;">
                      <option selected>Available</option>
                      <option>Booked</option>
                      <option>Maintenance</option>
                    </select>
                  </td>
                  <td><button class="btn primary">Save</button></td>
                </tr>

                <tr>
                  <td>Deluxe Room</td>
                  <td><input type="number" value="280" class="field-group" style="min-height: 42px;" /></td>
                  <td>
                    <select class="field-group" style="min-height: 42px;">
                      <option selected>Available</option>
                      <option>Booked</option>
                      <option>Maintenance</option>
                    </select>
                  </td>
                  <td><button class="btn primary">Save</button></td>
                </tr>

                <tr>
                  <td>Executive Suite</td>
                  <td><input type="number" value="380" class="field-group" style="min-height: 42px;" /></td>
                  <td>
                    <select class="field-group" style="min-height: 42px;">
                      <option selected>Available</option>
                      <option>Booked</option>
                      <option>Maintenance</option>
                    </select>
                  </td>
                  <td><button class="btn primary">Save</button></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
